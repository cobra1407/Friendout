version: 2
updates:
  # Frontend (React/TypeScript) — pnpm/npm packages
  - package-ecosystem: "npm"
    directory: "/friendout-frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    # Wait 7 days before proposing a freshly published version, so a compromised
    # or yanked release has time to be caught. Security updates are not delayed.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Backend (.NET) — NuGet packages
  - package-ecosystem: "nuget"
    directory: "/friendout-backend"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions workflows, if/when you add CI
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
