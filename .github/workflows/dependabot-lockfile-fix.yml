name: Fix Dependabot lockfile

on:
  pull_request:
    paths:
      - "friendout-frontend/package.json"
      - "friendout-frontend/pnpm-lock.yaml"
      - "friendout-frontend/pnpm-workspace.yaml"

permissions:
  contents: write

jobs:
  fix-lockfile:
    # Only for Dependabot
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: friendout-frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          # PAT so the push triggers the regular CI again
          token: ${{ secrets.LOCKFILE_FIX_TOKEN }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Reads the pnpm version from the "packageManager" field
          package_json_file: friendout-frontend/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: friendout-frontend/pnpm-lock.yaml

      - name: Regenerate lockfile
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Commit if changed
        run: |
          if ! git diff --quiet pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: sync pnpm lockfile"
            git push
          fi
