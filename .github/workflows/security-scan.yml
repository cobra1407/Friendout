name: Security scan

# Weekly + on-demand security scan. Each job is independent so one failure
# does not hide the others. A failed run makes GitHub send an email.
# The pull_request trigger only fires when this file itself changes, so the
# workflow gets tested before it lands on main.
on:
  schedule:
    - cron: "0 6 * * 1" # every Monday at 06:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/security-scan.yml"

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: leaks can live in old commits
          persist-credentials: false

      # Reads .gitleaksignore from the repository root.
      - name: Scan git history
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect -s /repo --redact --verbose

  semgrep:
    name: Code (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # request-host-used is excluded: the frontend nginx always runs behind
      # a reverse proxy, so $host is not attacker-controlled there.
      - name: Scan code
        run: >
          docker run --rm -v "$PWD:/src" semgrep/semgrep:latest
          semgrep scan
          --config p/owasp-top-ten --config p/csharp --config p/typescript
          --exclude-rule generic.nginx.security.request-host-used.request-host-used
          --error /src

  nuget-audit:
    name: Backend dependencies (NuGet)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      # "dotnet list package --vulnerable" never fails by itself, so look for
      # its report line in the output.
      - name: Check vulnerable packages
        working-directory: friendout-backend
        run: |
          dotnet list package --vulnerable --include-transitive | tee audit.txt
          if grep -q "has the following vulnerable packages" audit.txt; then
            echo "::error::Vulnerable NuGet packages found"
            exit 1
          fi

  pnpm-audit:
    name: Frontend dependencies (pnpm)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: friendout-frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # Production dependencies only: build tools never reach the nginx image.
      - name: Audit
        run: pnpm audit --prod --audit-level high
