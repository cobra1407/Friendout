server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── API proxy → backend ─────────────────────────────────────────────────
    # Toutes les requêtes /api/* sont redirigées vers le conteneur backend.
    # Nginx résout "backend" via le réseau Docker Compose.
    location /api/ {
        proxy_pass         http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        # X-Forwarded-Proto passes through the scheme set by the outer reverse proxy
        # (e.g. Nginx Proxy Manager, Cloudflare) so ASP.NET Core sees "https"
        # instead of the internal "http" used between containers.
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Port  80;

        # Timeouts généreux pour les uploads (30 MB max côté backend)
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
        client_max_body_size 30m;
    }

    # ── Uploads proxy → backend ─────────────────────────────────────────────
    location /uploads/ {
        proxy_pass         http://backend:8080/uploads/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
    }

    # ── SPA fallback (React Router) ─────────────────────────────────────────
    # Tous les chemins inconnus renvoient index.html pour que React Router
    # puisse gérer le routing côté client.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Cache assets statiques ──────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Gzip ────────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1024;
}
