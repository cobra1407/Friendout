services:

  # ── Base de données MySQL ─────────────────────────────────────────────────
  db:
    image: mysql:8.4
    container_name: friendout-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - friendout-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Backend ASP.NET Core 9 ────────────────────────────────────────────────
  backend:
    build:
      context: ./friendout-backend
      dockerfile: Dockerfile
    container_name: friendout-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production

      # Base de données
      ConnectionStrings__FriendoutDatabase: "Server=db;Port=3306;Database=${MYSQL_DATABASE};User=${MYSQL_USER};Password=${MYSQL_PASSWORD};AllowPublicKeyRetrieval=true;"

      # JWT
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${APP_URL}
      Jwt__Audience: ${APP_URL}

      # Discord OAuth
      Authentication__Discord__ClientId: ${DISCORD_CLIENT_ID}
      Authentication__Discord__ClientSecret: ${DISCORD_CLIENT_SECRET}
      Authentication__Discord__CallbackPath: /api/auth/callback/discord

      # Redirections frontend (même domaine, géré par Nginx)
      Frontend__LoginUrl: ${APP_URL}/login
      Frontend__ActivitiesUrl: ${APP_URL}/activities

      # CORS – le frontend est servi sur le même domaine via Nginx
      Cors__AllowedOrigins: ${APP_URL}

      # Guilds Discord autorisés (optionnel)
      Discord__AllowedGuildIds: ${DISCORD_ALLOWED_GUILD_IDS}

      # Seed (désactivé en prod par défaut, passer à true pour seeder au démarrage)
      Seed__Enabled: ${SEED_ENABLED:-false}

    volumes:
      # Persistance des fichiers uploadés
      - uploads_data:/app/uploads
    networks:
      - friendout-net
    # Pas de port exposé vers l'extérieur : Nginx est le seul point d'entrée

  # ── Frontend React + Nginx ────────────────────────────────────────────────
  frontend:
    build:
      context: ./friendout-frontend
      dockerfile: Dockerfile
    container_name: friendout-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - friendout-net

# ── Volumes persistants ───────────────────────────────────────────────────
volumes:
  mysql_data:
  uploads_data:

# ── Réseau interne ────────────────────────────────────────────────────────
networks:
  friendout-net:
    driver: bridge
