services:
  # Database MySQL
  db:
    image: mysql:8.4
    container_name: friendout-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - friendout-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ASP.NET Core 9 Backend
  backend:
    build:
      context: ./friendout-backend
      dockerfile: Dockerfile
    container_name: friendout-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__FriendoutDatabase: "Server=db;Port=3306;Database=${MYSQL_DATABASE};User=${MYSQL_USER};Password=${MYSQL_PASSWORD};AllowPublicKeyRetrieval=true;"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${APP_URL}
      Jwt__Audience: ${APP_URL}
      Authentication__Discord__ClientId: ${DISCORD_CLIENT_ID}
      Authentication__Discord__ClientSecret: ${DISCORD_CLIENT_SECRET}
      Authentication__Discord__CallbackPath: /api/auth/callback/discord
      Frontend__LoginUrl: ${APP_URL}/login
      Frontend__ActivitiesUrl: ${APP_URL}/activities
      Cors__AllowedOrigins: ${APP_URL}
      Discord__AllowedGuildIds: ${DISCORD_ALLOWED_GUILD_IDS}
      Seed__Enabled: ${SEED_ENABLED:-false}
    volumes:
      - uploads_data:/app/uploads
    networks:
      - friendout-net

  # React Frontend + Nginx
  frontend:
    build:
      context: ./friendout-frontend
      dockerfile: Dockerfile
    container_name: friendout-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - friendout-net

volumes:
  mysql_data:
  uploads_data:

networks:
  friendout-net:
    driver: bridge
