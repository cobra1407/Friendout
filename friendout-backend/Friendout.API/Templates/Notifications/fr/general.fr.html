<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notification — Friendout</title>
</head>
<body style="margin:0;padding:0;background-color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f8fafc;">
    <tr>
      <td align="center" style="padding:40px 16px;">

        <table width="520" cellpadding="0" cellspacing="0" border="0" style="max-width:520px;width:100%;background-color:#ffffff;border-radius:24px;overflow:hidden;">

          <!-- Logo -->
          <tr>
            <td align="center" style="padding:28px 32px 20px;">
              <img src="{{ AppUrl }}/email-assets/friendout-spring.svg" alt="Friendout" width="90" height="90" style="display:inline-block;">
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:16px 32px 0;">
              <p style="margin:0 0 18px;color:#3f3f46;font-size:15px;line-height:1.7;">Bonjour <strong style="color:#18181b;">{{ UserName }}</strong>,</p>
            </td>
          </tr>

          <!-- Message box -->
          <tr>
            <td style="padding:0 32px 16px;">
              <table width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="background-color:#f8fafc;border-left:4px solid #15343e;border-radius:8px;padding:16px 20px;">
                    <p style="margin:0;color:#3f3f46;font-size:15px;line-height:1.7;">{{ Message }}</p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Sign-off -->
          <tr>
            <td style="padding:8px 32px 28px;">
              <p style="margin:0 0 4px;color:#3f3f46;font-size:15px;line-height:1.6;">À très vite,</p>
              <p style="margin:0;color:#3f3f46;font-size:15px;line-height:1.6;"><strong style="color:#18181b;">L'équipe Friendout 🌿</strong></p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" style="background-color:#fafafa;border-top:1px solid #f4f4f5;padding:20px 36px;">
              <p style="margin:0;color:#a1a1aa;font-size:12px;line-height:1.6;">Cet e-mail vous a été envoyé par Friendout.</p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
